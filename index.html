<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Kevin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <img
          src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
          alt="Pokeball"
          class="logo"
        />
        <h1>Pokédex Kevin</h1>

        <div class="controls">
          <input
            type="text"
            id="search-input"
            placeholder="🔍 Buscar Pokémon..."
          />

          <div class="select-container">
            <label for="gen-selector">Región:</label>
            <select id="gen-selector">
              <option value="1">Kanto (Gen 1)</option>
              <option value="2">Johto (Gen 2)</option>
              <option value="3">Hoenn (Gen 3)</option>
              <option value="4">Sinnoh (Gen 4)</option>
            </select>
          </div>
        </div>
      </header>

      <main>
        <div id="pokemon-grid" class="grid-container"></div>
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modal-top" class="modal-top-bg">
          <button class="close-btn" onclick="closeModal()">×</button>

          <div class="action-buttons-container">
            <button id="btn-shiny" class="shiny-toggle">✨ Shiny: OFF</button>
            <button id="btn-mega" class="mega-toggle" style="display: none">
              🧬 Mega
            </button>
          </div>

          <img id="modal-img" class="pokemon-hero-img" src="" alt="Pokemon" />
        </div>

        <div class="modal-data-container">
          <div class="modal-header-row">
            <h2 id="modal-name">Bulbasaur</h2>
            <button id="btn-sound" class="sound-button" title="Escuchar">
              🔊
            </button>
          </div>

          <span id="modal-id">#001</span>

          <div
            id="modal-types"
            class="types"
            style="justify-content: center; margin-bottom: 20px"
          ></div>

          <h3 class="info-title">Sobre el Pokémon</h3>
          <p id="modal-desc">...</p>

          <h3 class="info-title" style="margin-top: 20px">Estadísticas Base</h3>
          <div id="modal-stats" class="stats-container"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <style>
      .modal-header-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
      }

      #modal-name {
        margin: 0;
        font-size: 2rem;
        text-transform: capitalize;
        font-weight: 700;
        /* ✅ CORRECCIÓN: Usamos variables CSS en lugar de color fijo */
        color: var(--text-color);
      }

      #modal-id {
        color: #aaa;
        font-weight: bold;
        display: block;
        margin-bottom: 15px;
        font-size: 1.1rem;
      }

      .info-title {
        font-size: 0.9rem;
        /* ✅ CORRECCIÓN: Usamos variables para que se vea en modo oscuro */
        color: var(--text-secondary);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }

      #modal-desc {
        font-size: 0.95rem;
        /* ✅ CORRECCIÓN: Usamos variables */
        color: var(--text-secondary);
        line-height: 1.6;
      }

      /* Aseguramos que el contenedor de datos respete el fondo del tema */
      .modal-data-container {
        background-color: var(--card-bg);
        transition: background-color 0.3s;
      }
    </style>
  </body>
</html>
